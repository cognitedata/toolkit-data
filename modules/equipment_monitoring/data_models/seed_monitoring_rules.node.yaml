- space: "{{ monitoring_space }}"
  externalId: rule_lp_flow_spike
  sources:
    - source:
        space: "{{ monitoring_space }}"
        externalId: MonitoringRule
        version: "1.0"
        type: view
      properties:
        name: LP Flow Spike Rule
        time_series_external_id: comp_lp_flow
        interval_minutes: 15

